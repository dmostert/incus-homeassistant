# Describes the Incus services so they show up with a UI in Home Assistant.
start_instance:
  name: Start instance
  description: Start an Incus instance (container or virtual machine).
  fields:
    instance:
      name: Instance
      description: Name of the Incus instance.
      required: true
      example: my-container
      selector:
        text:
    project:
      name: Project
      description: Incus project the instance lives in. Defaults to the instance's own project.
      required: false
      example: default
      selector:
        text:
    force:
      name: Force
      description: Force the action (only meaningful for stop/restart).
      required: false
      selector:
        boolean:
    timeout:
      name: Timeout
      description: How long to wait for the action, in seconds.
      required: false
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
    entry_id:
      name: Config entry
      description: Only act on a specific Incus config entry (useful with multiple servers).
      required: false
      selector:
        text:

stop_instance:
  name: Stop instance
  description: Stop an Incus instance (container or virtual machine).
  fields:
    instance:
      name: Instance
      description: Name of the Incus instance.
      required: true
      example: my-container
      selector:
        text:
    project:
      name: Project
      description: Incus project the instance lives in. Defaults to the instance's own project.
      required: false
      selector:
        text:
    force:
      name: Force
      description: Force a hard stop instead of a clean shutdown.
      required: false
      selector:
        boolean:
    timeout:
      name: Timeout
      description: How long to wait for the instance to stop, in seconds.
      required: false
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
    entry_id:
      name: Config entry
      description: Only act on a specific Incus config entry (useful with multiple servers).
      required: false
      selector:
        text:

